services:
  - type: web
    name: hard-disk-analyzer
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hard-disk-analyzer-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: hard-disk-analyzer-db
    databaseName: diskguardian
    user: diskguardian
