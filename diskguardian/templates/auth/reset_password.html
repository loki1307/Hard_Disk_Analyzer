{% extends "auth/base_auth.html" %}
{% block title %}Reset Password — Hard Disk Analyzer{% endblock %}
{% block auth_title %}Set New Password{% endblock %}
{% block auth_sub %}Enter your new password below{% endblock %}

{% block auth_content %}
<form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="mb-3">
    <label class="form-label">New Password</label>
    <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required minlength="8" autofocus/>
  </div>
  <div class="mb-3">
    <label class="form-label">Confirm Password</label>
    <input type="password" name="confirm" class="form-control" placeholder="Repeat password" required minlength="8"/>
  </div>
  <button type="submit" class="btn btn-primary w-100 py-2">
    <i class="bi bi-check-circle me-1"></i> Update Password
  </button>
</form>
{% endblock %}
