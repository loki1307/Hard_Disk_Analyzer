<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Error — Hard Disk Analyzer{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh;
           display: flex; align-items: center; justify-content: center;
           background-image: radial-gradient(ellipse at 30% 30%, rgba(239,68,68,0.06) 0%, transparent 50%); }
    .error-code { font-size: 120px; font-weight: 900; line-height: 1;
                  background: linear-gradient(135deg, #ef4444, #f97316);
                  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .error-card { background: rgba(31,41,55,0.9); border: 1px solid rgba(255,255,255,0.08);
                  border-radius: 16px; padding: 48px; max-width: 520px; text-align: center; }
    .btn-home { background: #3b82f6; border: none; font-weight: 600; padding: 12px 28px; border-radius: 8px; }
    .btn-home:hover { background: #2563eb; }
  </style>
</head>
<body>
<div class="error-card">
  <div class="error-code">{% block code %}Error{% endblock %}</div>
  <h1 style="font-size:22px;font-weight:700;color:#f1f5f9;margin:16px 0 8px;">{% block heading %}Something went wrong{% endblock %}</h1>
  <p style="color:#9ca3af;font-size:14px;margin-bottom:28px;">{% block description %}An unexpected error occurred.{% endblock %}</p>
  <a href="/" class="btn btn-home text-white me-2"><i class="bi bi-house me-1"></i>Go Home</a>
  <button onclick="history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Go Back</button>
</div>
</body>
</html>
